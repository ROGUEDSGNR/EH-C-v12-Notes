# Build and validate the hardened mdBook site; deploy only trusted main-branch runs.
name: Validate and deploy mdBook to Pages

on:
  schedule:
    - cron: "17 3 * * 1"
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Serialize validation with production publication so an older slow run cannot
# deploy after a newer main-branch run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Record dependency posture
        run: |
          set -euo pipefail
          node --version
          test ! -e package.json
          test ! -e package-lock.json
          echo "npm audit: not applicable—no npm manifest, lockfile, or installed npm dependency graph."

      - name: Validate source navigation and theme
        run: node scripts/validate-navigation.mjs source

      - name: Build the pinned mdBook container
        env:
          IMAGE: ehc-mdbook:${{ github.sha }}
        run: docker build --pull --tag "$IMAGE" --file .devcontainer/Dockerfile .devcontainer

      - name: Record generator versions and audit its exact Rust lockfile
        env:
          IMAGE: ehc-mdbook:${{ github.sha }}
        run: |
          set -euo pipefail
          docker run --rm --network none "$IMAGE" sh -lc 'node --version && mdbook --version'
          container_id="$(docker create "$IMAGE" true)"
          cleanup() { docker rm --force "$container_id" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker cp "$container_id:/usr/local/share/mdbook/Cargo.lock" \
            "$RUNNER_TEMP/mdbook.Cargo.lock"
          cleanup
          trap - EXIT
          node scripts/audit-cargo-lock-osv.mjs "$RUNNER_TEMP/mdbook.Cargo.lock"

      - name: Stage the exact mdBook source
        run: node scripts/stage-mdbook.mjs

      - name: Build without network access
        env:
          IMAGE: ehc-mdbook:${{ github.sha }}
        run: |
          set -euo pipefail
          docker run --rm --network none \
            --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            "$IMAGE" mdbook build
          test -f _book/toc.html
          test ! -L _book/toc.html
          rm -- _book/toc.html

      - name: Validate the generated allowlisted artifact
        run: node scripts/validate-navigation.mjs generated

      - name: Smoke-test the private loopback preview
        run: |
          set -euo pipefail
          node scripts/preview.mjs >"$RUNNER_TEMP/preview.log" 2>&1 &
          preview_pid="$!"
          cleanup() {
            kill "$preview_pid" >/dev/null 2>&1 || true
            wait "$preview_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for attempt in {1..20}; do
            if curl --fail --silent --show-error \
              http://127.0.0.1:4000/ >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              cat "$RUNNER_TEMP/preview.log"
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent --show-error \
            http://127.0.0.1:4000/Labs/14-Hacking_Web_Applications-Labs.html \
            >/dev/null
          curl --fail --silent --show-error \
            http://127.0.0.1:4000/Resources/Footprinting_Checklist.html \
            >/dev/null
          curl --fail --silent --show-error \
            http://127.0.0.1:4000/Images/Pasted%20image%2020240704103804.png \
            >/dev/null
          curl --fail --silent --show-error --dump-header "$RUNNER_TEMP/headers" \
            --output /dev/null http://127.0.0.1:4000/20-Cryptography.html
          grep -Fiq "Content-Security-Policy:" "$RUNNER_TEMP/headers"
          grep -Fiq "X-Content-Type-Options: nosniff" "$RUNNER_TEMP/headers"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:4000/not-a-page)" = "404"
          cleanup
          trap - EXIT

      - name: Confirm the build did not change tracked files
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Archive Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          INPUT_PATH: ./_book
        run: |
          set -euo pipefail
          tar \
            --dereference --hard-dereference \
            --directory "$INPUT_PATH" \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            .

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
