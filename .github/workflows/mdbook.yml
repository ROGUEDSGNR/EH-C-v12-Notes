# Build and validate the HonKit site; deploy only trusted main-branch runs.
name: Validate and deploy HonKit to Pages

on:
  pull_request:
  push:
    branches:
      - main
      - fix/honkit-navigation-security
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Record runtime versions
        run: |
          node --version
          npm --version
          ./node_modules/.bin/honkit --version
      - name: Audit dependencies
        continue-on-error: true
        run: npm audit --audit-level=low
      - name: Build with HonKit
        run: ./node_modules/.bin/honkit build . _book
      - name: Record baseline navigation output
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const summary = fs.readFileSync("SUMMARY.md", "utf8");
          const entries = [...summary.matchAll(/\[[^\]]+\]\(([^)]+\.md(?:#[^)]*)?)\)/g)];
          const rawMarkdown = [];
          const htmlFiles = [];
          const walk = (directory) => {
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              const item = path.join(directory, entry.name);
              if (entry.isDirectory()) walk(item);
              else if (item.endsWith(".md")) rawMarkdown.push(item);
              else if (item.endsWith(".html")) htmlFiles.push(item);
            }
          };
          walk("_book");

          console.log(`SUMMARY page entries: ${entries.length}`);
          console.log(`Generated HTML files: ${htmlFiles.length}`);
          console.log(`Raw Markdown files in _book: ${rawMarkdown.length}`);
          for (const item of rawMarkdown) console.log(item);
          NODE
      - name: Archive Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          tar \
            --dereference --hard-dereference \
            --directory "_book" \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            .
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
